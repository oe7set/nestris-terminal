# Retroverse Terminal configuration (%APPDATA%\NestrisTerminal\config.toml).
# Normally edited through the hidden menu (5 taps on the logo + PIN).
# Environment variables override it: NESTRIS_TERMINAL__HOST__TOKEN=...

[host]
url = "http://127.0.0.1:7990"     # NestrisLTM
token = ""                         # API token with the "terminal" scope
timeout_s = 8.0

[rfid]
driver = "serial"                  # "fake" = simulated reader (debug menu); reader firmware: protocol v2
port = ""                          # empty = auto-detect the ESP32 (CP210x/CH340)
baud = 115200
write_timeout_s = 15.0              # how long a card write waits for the card (max 60)

[kiosk]
fullscreen = true
hide_cursor = false
lang = "de"
card_grace_s = 3.0                 # player page stays this long after the card left
idle_timeout_s = 120.0             # back to the main menu without touches

[admin]
pin_hash = ""                      # empty = default PIN 2580; set via the menu or `set-pin`

[http]
host = "127.0.0.1"
port = 7991

[log]
level = "INFO"
to_file = true

[updates]
# Hidden menu -> Updates. Checks GitHub releases; installing is always a tap.
enabled = true            # check automatically (1 min after start, then every check_interval_h)
channel = "stable"        # "beta" also offers pre-releases
owner = "oe7set"
app_repo = "nestris-terminal"
reader_repo = "nestris-rfid-reader"
token = ""                # optional GitHub token (rate limit on shared IPs)
check_interval_h = 24
